services:
  agent:
    build:
      context: .
      args: [CLAUDE_CODE_VERSION]  # from your shell or .env; unset = the Dockerfile's default
    platform: linux/amd64  # the image downloads amd64 binaries
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      # Extra flags for claude. Empty = default interactive mode (auto mode, with the classifier).
      CLAUDE_FLAGS: ${CLAUDE_FLAGS:-}
    volumes:
      - data:/data
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT:-4g}  # a long session grows; a cap turns a leak into a restart instead of a bill
volumes:
  data:
