name: Bug report
description: Something does not behave as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and host
      description: Commit or tag, and where it runs (Railway, Docker on Linux, Docker Desktop…).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The log lines around the problem
      description: From the service's log (docs/TROUBLESHOOTING.md says where). The log never prints a key or a token. Do not paste the agent's screen or its conversations, or the contents of .env.
      render: shell
