name: Bug report
description: Something does not behave as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and host
      description: Commit or tag, and where it runs (Railway, Docker on Linux, Docker Desktop…).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of bin/screen.sh
      description: Remove tokens, keys and chat ids before pasting.
      render: shell
