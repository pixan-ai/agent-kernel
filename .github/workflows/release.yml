name: Release

# A `v*` tag publishes the image. Pull requests that touch this file or the Dockerfile, and manual runs, only
# exercise the release path against a throwaway registry, so the first real release is not the first test.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Release path against a throwaway registry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      registry:
        image: registry:3@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
        ports:
          - 5000:5000
    env:
      IMAGE: localhost:5000/agent-kernel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      # Like a release: pushed by digest, with no tag until it is checked and signed.
      - name: Build and push by digest with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: base
          outputs: type=image,name=localhost:5000/agent-kernel,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The published target contains no Claude Code
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if docker run --rm --entrypoint bash "$IMAGE@$DIGEST" -c 'command -v claude || ls /home/agent/.local/bin/claude /opt/seed/config 2>/dev/null | grep .'; then
            echo "the base target must not contain Claude Code or the plugin"; exit 1
          fi
      - name: The image carries an SBOM and SLSA provenance
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' | jq -e '[.. | objects | select(has("SPDXID"))] | length > 0'
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Provenance}}' | jq -e '[.. | objects | select(has("buildType"))] | length > 0'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign with an ephemeral key, verify, and see a wrong key fail
        env:
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cd "$RUNNER_TEMP"
          cosign generate-key-pair
          cosign generate-key-pair --output-key-prefix other
          cosign sign --yes --key cosign.key --use-signing-config=false --new-bundle-format=false --tlog-upload=false --allow-http-registry "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub --insecure-ignore-tlog --allow-http-registry "$IMAGE@$DIGEST"
          if cosign verify --key other.pub --insecure-ignore-tlog --allow-http-registry "$IMAGE@$DIGEST"; then
            echo "verification with the wrong key must fail"; exit 1
          fi
      - name: Only now, the tag, on the very digest that was signed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:test" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:test" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"

  publish:
    name: Publish, sign and attest
    needs: acceptance
    # Publishes only the base target (no Claude Code), and only while the repository variable PUBLISH_IMAGE is true (on since
    # 2026-11-19; decisions in docs/PRODUCT-IMAGE.md).
    # To GitHub's registry always; to Docker Hub too when the variable DOCKERHUB_REPOSITORY (NAMESPACE/NAME) and the secrets
    # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write access to that repository only) are set.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      HUB: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: vars.DOCKERHUB_REPOSITORY != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_REPOSITORY }},enable=${{ vars.DOCKERHUB_REPOSITORY != '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Pushed by digest only: no version tag points at it until it is checked, signed and verified (last step).
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: base
          outputs: type=image,"name=${{ env.IMAGE }}${{ vars.DOCKERHUB_REPOSITORY != '' && format(',docker.io/{0}', vars.DOCKERHUB_REPOSITORY) || '' }}",push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      # The publish build is a new build: check the digest that was pushed, before it is signed. An unsigned digest is not a release.
      - name: The pushed image has no Claude Code
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if docker run --rm --entrypoint bash "$IMAGE@$DIGEST" -c 'command -v claude || ls /home/agent/.local/bin/claude /opt/seed/config 2>/dev/null | grep .'; then
            echo "the base target must not contain Claude Code or the plugin"; exit 1
          fi
      - name: No fixable CRITICAL vulnerability in the pushed image (Trivy, blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          [ -z "$HUB" ] || cosign sign --yes "docker.io/$HUB@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Verify what was just published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for ref in "$IMAGE" ${HUB:+"docker.io/$HUB"}; do
            cosign verify "$ref@$DIGEST" \
              --certificate-identity-regexp "^https://github.com/${REPO}/\.github/workflows/release\.yml@refs/tags/v.+$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$REPO"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' | jq -e '[.. | objects | select(has("SPDXID"))] | length > 0'
      - name: Only now, the version tags, on the very digest that was signed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker buildx imagetools create -t "$t" "${t%:*}@$DIGEST"
            test "$(docker buildx imagetools inspect "$t" --format '{{json .Manifest}}' | jq -r .digest)" = "$DIGEST"
          done
